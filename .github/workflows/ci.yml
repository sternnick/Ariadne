name: ci

# AGENT_CONTRACT C4.2. Every job is a rule from AGENT_CONTRACT.md; a green run means "claims are
# linked, dated and reachable", never "claims are true".
#
# PUBLIC-REPO HARDENING (GATE 4, recorded in DECISIONS D-026):
#   * every third-party action is pinned to a full commit SHA — a tag can be moved, a SHA cannot;
#   * `permissions:` is declared here and in each workflow, defaulting to `contents: read`;
#   * no `pull_request_target` anywhere: every job runs on `pull_request` and never checks out
#     untrusted code with elevated rights;
#   * no secrets are referenced by any workflow, so a fork PR has nothing to exfiltrate;
#   * no self-hosted runners (all jobs are `ubuntu-latest`, GitHub-hosted and ephemeral);
#   * the six gates are separate jobs so each can be a required status check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh:
    name: fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: python scripts/fresh.py

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: python scripts/provenance.py

  sources:
    name: sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: source registry integrity (offline, no --probe)
        run: python scripts/check-sources.py

  # Python 3.10 is claimed by `requires-python`, and a claim about an interpreter nobody runs is not a
  # claim. This job runs the same suite on 3.10 and prints the version it actually used.
  #
  # It is deliberately NOT one of the seven required status checks: making a matrix leg required would
  # rename the `pytest` context ("pytest (3.11)"), and a renamed required context silently stops gating
  # (docs/08 records the version claim as verified-or-not in the job's own log, not in a README).
  pytest-310:
    name: pytest-3.10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      # The version is printed, not assumed: "we support 3.10" is only evidence if the log names the
      # interpreter that ran.
      - run: python -c "import sys; print('interpreter', sys.version)"
      - run: python -m pip install --disable-pip-version-check -e .[dev]
      - run: python -m pytest

  # The default run reports one skip: the text-PDF test needs an optional backend the dependency policy
  # excludes. Here the backend is installed and ARIADNE_REQUIRE_PDF_BACKEND turns the skip into a hard
  # failure, so "it would have passed" is checked rather than asserted (D-043).
  pytest-pdf:
    name: pytest-pdf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -e ".[dev,pdf]"
      - run: python -c "import pymupdf; print('pymupdf', pymupdf.__doc__.splitlines()[0][:40])"
      - run: python -m pytest
        env:
          ARIADNE_REQUIRE_PDF_BACKEND: "1"

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      # The only job here that measures behaviour instead of the state of a claim. No third-party
      # packages, no network: fixtures, floors and published results are all in-tree, so the run is
      # reproducible offline and cannot fail for supply-chain reasons.
      - run: python scripts/bench.py --check

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: python scripts/check-links.py

  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q src

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: pytest (includes the C9 no-profiling gate)
        run: python -m pytest tests -q
      - name: CLI smoke test (the declared entry point must run)
        run: |
          ariadne --version
          printf 'SUMMARY\nEngineer\nSKILLS\npython, docker\n' > "${RUNNER_TEMP}/a.txt"
          printf 'SKILLS\npython, kubernetes\n' > "${RUNNER_TEMP}/b.txt"
          ariadne inspect "${RUNNER_TEMP}/a.txt"
          ariadne compare "${RUNNER_TEMP}/a.txt" "${RUNNER_TEMP}/b.txt"
