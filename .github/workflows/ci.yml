name: ci

# AGENT_CONTRACT C4.2. Every gate here is a rule from AGENT_CONTRACT.md; a green run means
# "claims are linked, dated and reachable", never "claims are true".
#
# Deliberate design points:
#   * check-sources.py runs WITHOUT --probe. A build must not fail because a third party had a bad
#     afternoon (the parent project lost a day of pushes to one expired credential). Probing is a
#     manual/scheduled action, not a commit gate.
#   * No network access is needed for any gate except the pip install itself.
#   * The full test suite runs, not a subset: a gate that can be skipped by not naming a file is not
#     a gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (no runtime dependencies, dev extra only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: C3 freshness (90-day gate; fails on stale or missing header)
        run: python scripts/fresh.py

      - name: C4 provenance (fails on a dangling id or an uncited source)
        run: python scripts/provenance.py

      - name: C4 source registry (offline: recorded state, no --probe)
        run: python scripts/check-sources.py

      - name: C4 dead relative links in tracked markdown
        run: python scripts/check-links.py

      - name: Compile check (a file that cannot be imported is not a library)
        run: python -m compileall -q src

      - name: Tests (includes the C9 no-profiling gate)
        run: python -m pytest tests -q

      - name: CLI smoke test (the declared entry point must run)
        run: |
          ariadne --version
          printf 'SUMMARY\nEngineer\nSKILLS\npython, docker\n' > /tmp/a.txt
          printf 'SKILLS\npython, kubernetes\n' > /tmp/b.txt
          ariadne inspect /tmp/a.txt
          ariadne compare /tmp/a.txt /tmp/b.txt
