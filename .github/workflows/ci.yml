name: ci

# AGENT_CONTRACT C4.2. Every job here is a rule from AGENT_CONTRACT.md; a green run means
# "claims are linked, dated and reachable", never "claims are true".
#
# SIX JOBS, not one, on purpose: each becomes a separately required status check on `main`
# (DECISIONS D-017), so a failure names the rule that broke instead of "CI failed".
#
# Deliberate design points:
#   * check-sources runs WITHOUT --probe. A build must not fail because a third party had a bad
#     afternoon (the parent project lost a day of pushes to one expired credential). Probing is a
#     manual/scheduled action, not a commit gate.
#   * Only the `tests` job installs anything; the five script gates are stdlib-only, so they stay
#     fast and cannot be broken by a dependency resolution.
#   * No network access is needed for any gate except the pip install itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh:
    name: fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: C3 freshness (90-day and 30-day clocks)
        run: python scripts/fresh.py

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: C4 bidirectional citation check
        run: python scripts/provenance.py

  sources:
    name: sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: C4 source registry integrity (offline, no --probe)
        run: python scripts/check-sources.py

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: C4 dead relative links in tracked markdown
        run: python scripts/check-links.py

  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every module must compile (a file that cannot be imported is not a library)
        run: python -m compileall -q src

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (no runtime dependencies, dev extra only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: pytest (includes the C9 no-profiling gate)
        run: python -m pytest tests -q
      - name: CLI smoke test (the declared entry point must run)
        run: |
          ariadne --version
          printf 'SUMMARY\nEngineer\nSKILLS\npython, docker\n' > /tmp/a.txt
          printf 'SKILLS\npython, kubernetes\n' > /tmp/b.txt
          ariadne inspect /tmp/a.txt
          ariadne compare /tmp/a.txt /tmp/b.txt
