name: ci

# AGENT_CONTRACT C4.2. Every job is a rule from AGENT_CONTRACT.md; a green run means "claims are
# linked, dated and reachable", never "claims are true".
#
# PUBLIC-REPO HARDENING (GATE 4, recorded in DECISIONS D-026):
#   * every third-party action is pinned to a full commit SHA — a tag can be moved, a SHA cannot;
#   * `permissions:` is declared here and in each workflow, defaulting to `contents: read`;
#   * no `pull_request_target` anywhere: every job runs on `pull_request` and never checks out
#     untrusted code with elevated rights;
#   * no secrets are referenced by any workflow, so a fork PR has nothing to exfiltrate;
#   * no self-hosted runners (all jobs are `ubuntu-latest`, GitHub-hosted and ephemeral);
#   * the six gates are separate jobs so each can be a required status check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh:
    name: fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: python scripts/fresh.py

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: python scripts/provenance.py

  sources:
    name: sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: source registry integrity (offline, no --probe)
        run: python scripts/check-sources.py

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: python scripts/check-links.py

  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m compileall -q src

  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: pytest (includes the C9 no-profiling gate)
        run: python -m pytest tests -q
      - name: CLI smoke test (the declared entry point must run)
        run: |
          ariadne --version
          printf 'SUMMARY\nEngineer\nSKILLS\npython, docker\n' > "${RUNNER_TEMP}/a.txt"
          printf 'SKILLS\npython, kubernetes\n' > "${RUNNER_TEMP}/b.txt"
          ariadne inspect "${RUNNER_TEMP}/a.txt"
          ariadne compare "${RUNNER_TEMP}/a.txt" "${RUNNER_TEMP}/b.txt"
