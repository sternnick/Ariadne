name: dependency-review

# GATE 4: a public repository must review dependency changes on every PR.
#
# Scope note that matters here: the package itself has ZERO runtime dependencies (D-016), so this job
# is mostly a tripwire for the *dev* extra and for the workflows' pinned actions. It is still worth
# running: a PR that adds a dependency should fail loudly and require a DECISIONS entry (C7.2).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # needed only to post the summary comment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
