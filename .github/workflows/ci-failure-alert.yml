name: ci-failure-alert

# Workflow B — if CI fails on main, the repository screams (D-032).
#
# Why this exists: branch protection stops a red merge *forward*, but it does not tell anyone that
# `main` is already red — e.g. a hotfix pushed as an admin, a flaky infra failure, or a broken
# scheduled job. This workflow watches the `ci` workflow's completion and opens exactly one issue per
# failing commit, assigned to the owner.
#
# `workflow_run` runs in the context of the BASE repository with a token that has the permissions
# declared below. It never checks out the triggering ref's code, so a fork cannot influence it.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  alert:
    name: alert-on-red-main
    # Only a failure on main. A failing PR branch is normal work in progress, not an alarm.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open (or update) an issue for the failed run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const short = sha.slice(0, 7);
            const title = `CI Failed on main: ${short}`;
            const body = [
              `**CI failed on \`main\`.**`,
              '',
              `- Commit: \`${sha}\``,
              `- Run: ${run.html_url}`,
              `- Branch: \`${run.head_branch}\``,
              `- Event: \`${run.event}\``,
              '',
              'Required checks that gated this commit: `fresh`, `provenance`, `sources`, `links`,',
              '`compile`, `pytest`. Until this is green, `main` is in a state no PR may merge into.',
              '',
              '_Opened automatically by `.github/workflows/ci-failure-alert.yml` (`D-032`)._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const label = 'ci-failure';
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20,
            });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Failed again on the same commit (${run.html_url}).`,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: [label], assignees: [owner],
              });
              core.info(`Opened issue #${created.data.number}`);
            }
